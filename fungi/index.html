    <section class="entry" id="2026-11-24">
      <h3>24 November 2026</h3>
      <figure class="photos">
        <img src="../images/fungi-2026-11-24-cap.jpg" width="1650" height="1320" loading="lazy" alt="Two brown mushroom caps side by side on grey gravel and fallen pine needles, their skin cracking into scales over white flesh.">

      <figure class="photos">
        <img src="../images/fungi-2026-11-17-gills.jpg" width="1659" height="2212" loading="lazy" alt="The same mushroom on its side, showing pale cream gills radiating from a slender stem, with a strong shadow.">
